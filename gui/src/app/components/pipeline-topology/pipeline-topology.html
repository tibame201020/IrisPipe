<mat-card class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden shadow-2xl mt-6">
  <mat-card-header class="p-4 border-b border-zinc-800 bg-zinc-950/50">
    <mat-card-title class="text-sm font-semibold tracking-wider text-zinc-400 uppercase flex items-center gap-2">
      <span class="material-icons text-blue-500 text-sm">account_tree</span>
      Pipeline Topology
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="p-8 bg-zinc-900/50">
    <!-- Horizontal Flow -->
    <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-6 relative">

      <!-- Connectors (Desktop only for simplicity) -->
      <div class="hidden lg:block absolute h-[2px] bg-zinc-800 w-full top-1/2 -translate-y-1/2 z-0">
          <div class="h-full bg-blue-500/50 transition-all duration-300"
               [style.width.%]="pipeline?.status === 'RUNNING' ? 50 : 0"></div>
      </div>

      <!-- Job Nodes -->
      <div *ngFor="let job of pipeline?.jobs; let i = index" class="z-10 w-full lg:w-1/3">
        <div class="bg-zinc-950 rounded-lg p-5 border shadow-xl relative transition-all duration-300 transform"
             [ngClass]="{
               'border-blue-500/50 hover:border-blue-500': job.status === 'RUNNING',
               'border-rose-500/50 shadow-rose-900/20': job.status === 'FAILED',
               'border-zinc-800 opacity-60': job.status === 'PENDING' || job.status === 'PAUSED',
               'border-emerald-500/30 opacity-80': job.status === 'COMPLETED',
               '-translate-y-1': job.status === 'RUNNING'
             }">

          <!-- Status Indicator Dot -->
          <div class="absolute -top-1.5 -right-1.5 h-3 w-3 rounded-full border-2 border-zinc-950"
               [ngClass]="{
                 'bg-blue-500': job.status === 'RUNNING',
                 'bg-rose-500 animate-pulse': job.status === 'FAILED',
                 'bg-zinc-600': job.status === 'PENDING' || job.status === 'PAUSED',
                 'bg-emerald-500': job.status === 'COMPLETED'
               }">
          </div>

          <div class="flex justify-between items-start mb-4">
            <div>
              <span class="text-[10px] font-mono tracking-widest text-zinc-500 uppercase">{{ job.type }}</span>
              <h3 class="text-white font-medium text-sm mt-1 leading-tight">{{ job.name }}</h3>
            </div>
            <!-- Atomic Level Badge -->
            <span class="px-2 py-0.5 rounded text-[9px] font-mono border"
                  [ngClass]="job.atomicLevel === 'CHUNK' ? 'bg-indigo-500/10 text-indigo-300 border-indigo-500/30' : 'bg-orange-500/10 text-orange-300 border-orange-500/30'">
              {{ job.atomicLevel }}
            </span>
          </div>

          <!-- Metrics -->
          <div class="space-y-3">
            <div class="flex justify-between items-end border-b border-zinc-800/50 pb-2">
              <span class="text-xs text-zinc-500">Rows</span>
              <span class="text-sm font-mono font-medium text-zinc-200 tabular-nums">
                 {{ job.processedRows | number }} <span class="text-zinc-600 text-[10px]">/ {{ job.totalRows | number }}</span>
              </span>
            </div>

            <div class="flex justify-between items-end border-b border-zinc-800/50 pb-2">
              <span class="text-xs text-zinc-500">Commits</span>
              <div class="flex items-center gap-1">
                 <span class="material-icons text-[14px] text-zinc-600">save</span>
                 <span class="text-sm font-mono font-medium text-blue-400 tabular-nums">{{ job.commitCount | number }}</span>
              </div>
            </div>

            <div class="flex justify-between items-end pb-1">
              <span class="text-xs text-zinc-500">Rate</span>
              <span class="text-sm font-mono font-medium text-zinc-300 tabular-nums">{{ job.throughput | number:'1.0-0' }} r/s</span>
            </div>
          </div>

          <!-- Progress bar -->
          <div class="mt-4 bg-zinc-900 rounded-full h-1 overflow-hidden">
             <div class="h-full bg-blue-500 transition-all duration-300 ease-linear"
                  [ngClass]="{'bg-rose-500': job.status === 'FAILED', 'bg-emerald-500': job.status === 'COMPLETED'}"
                  [style.width.%]="(job.processedRows / (job.totalRows || 1)) * 100">
             </div>
          </div>

        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
