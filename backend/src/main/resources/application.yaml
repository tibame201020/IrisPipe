spring:
  application:
    name: IrisPipe
  h2:
    console:
      enabled: true
      path: /h2-console
    datasource:
      url: jdbc:h2:./h2data/data;AUTO_SERVER=true;DB_CLOSE_DELAT=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    batch:
      jdbc:
        initialize-schema: always
      job:
        enabled: false
