spring:
  application:
    name: IrisPipe
  threads:
    virtual:
      enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:./h2data/data;AUTO_SERVER=true;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  batch:
    job:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true

config:
  accept-path: jobs
