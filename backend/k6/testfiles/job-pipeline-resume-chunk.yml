- jobName: k6_pipeline_resume_chunk_job
  executions:
    - type: INSERT
      name: k6_pipeline_resume_chunk_insert
      sql: select * from test_resume_chunk_source where update_time > :_LAST_UPDATE order by update_time asc
      destTable: test_resume_chunk_dest
      watermarkColumn: UPDATE_TIME
      parameters:
        - param: _LAST_UPDATE
          type: timestamp
          value: '1970-01-01 00:00:00'
  setting:
    fetchSize: 1
    batchSize: 2
    atomicLevel: CHUNK
  database:
    source:
      driver: org.h2.Driver
      url: jdbc:h2:./h2data/data
      username: sa
      password: "sa"
    dest:
      driver: org.h2.Driver
      url: jdbc:h2:./h2data/data
      username: sa
      password: "sa"
