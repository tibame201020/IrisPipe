- jobName: k6_test_job_chunk_fail
  executions:
    - type: INSERT
      name: k6_insert_chunk_fail
      sql: select * from test_source where update_time > :_LAST_UPDATE order by update_time asc
      destTable: test_dest
      watermarkColumn: UPDATE_TIME
      parameters:
        - param: _LAST_UPDATE
          type: timestamp
          value: '1970-01-01 00:00:00'
  setting:
    fetchSize: 1
    batchSize: 2 # Small chunk to force intermediate commits
    atomicLevel: CHUNK
  database:
    source:
      driver: org.h2.Driver
      url: jdbc:h2:./h2data/data
      username: sa
      password: "sa"
    dest:
      driver: org.h2.Driver
      url: jdbc:h2:./h2data/data
      username: sa
      password: "sa"
