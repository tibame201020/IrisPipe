<div class="toast-container" data-testid="app-toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast"
      [class.toast--success]="toast.level === 'success'"
      [class.toast--error]="toast.level === 'error'"
      [class.toast--info]="toast.level === 'info'"
      [attr.data-testid]="'app-toast-' + toast.level">
      <span>{{ toast.message }}</span>
      <button
        class="toast-dismiss"
        type="button"
        [attr.data-testid]="'app-toast-dismiss-' + toast.id"
        (click)="toastService.dismiss(toast.id)">
        Close
      </button>
    </div>
  }
</div>
