<div class="shell" data-testid="app-shell">
  <app-shell-header />

  @if (backendStatus() === 'DOWN') {
    <div class="shell-warning" data-testid="shell-backend-warning">
      Backend unavailable. UI state may be stale until health recovers.
    </div>
  }

  <div class="shell-body" [class.shell-body--compact]="shellLayout.isCompact()">
    @if (shellLayout.isCompact() && (shellLayout.sidebarOpen() || shellLayout.inspectorOpen())) {
      <button
        class="shell-overlay"
        type="button"
        data-testid="shell-overlay"
        aria-label="Close shell side panels"
        (click)="closeTransientPanels()">
      </button>
    }

    <aside
      class="shell-sidebar-region"
      [class.shell-panel-region--compact]="shellLayout.isCompact()"
      [class.shell-panel-region--open]="shellLayout.sidebarOpen()"
      data-testid="shell-sidebar-region">
      <app-shell-sidebar />
    </aside>

    <main class="shell-main-region" data-testid="shell-main-region" (click)="closeTransientPanels()">
      <router-outlet />
    </main>

    <aside
      class="shell-inspector-region"
      [class.shell-panel-region--compact]="shellLayout.isCompact()"
      [class.shell-panel-region--open]="shellLayout.inspectorOpen()"
      data-testid="shell-inspector-region">
      <app-run-inspector />
    </aside>
  </div>

  <app-shell-status-bar />
  <app-app-toast-container />
</div>
