<section class="page app-panel">
  <header class="page-header">
    <div>
      <h2 class="app-section-title">Recent Activity</h2>
      <p class="app-meta">Workspace: default / polling every 5 seconds</p>
    </div>
    <button class="app-button-secondary" type="button">Refresh</button>
  </header>

  <section class="table">
    <div class="table-head">
      <span>Run</span>
      <span>Status</span>
      <span>Pipeline</span>
      <span>Start</span>
      <span>End</span>
      <span>Action</span>
    </div>

    @for (run of runs; track run.id) {
      <div class="table-row">
        <span>#{{ run.id }}</span>
        <app-status-chip [status]="run.status" />
        <span>{{ run.pipeline }}</span>
        <span>{{ run.start }}</span>
        <span>{{ run.end }}</span>
        <button class="app-button-secondary" type="button">Inspect</button>
      </div>
    }
  </section>
</section>
