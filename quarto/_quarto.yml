project:
  type: website
  output-dir: _site

website:
  title: "IrisPipe"
  description: "A workspace-scoped pipeline engine built on Spring Boot and Spring Batch."
  favicon: "assets/favicon.ico"
  repo-url: https://github.com/tibame201020/IrisPipe
  repo-actions: [issue]

  navbar:
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Design"
        href: design.qmd
      - text: "Architecture"
        href: architecture.qmd
      - text: "Performance"
        href: performance.qmd
      - text: "繁體中文"
        menu:
          - text: "總覽"
            href: zh-TW/index.qmd
          - text: "設計說明"
            href: zh-TW/design.qmd
          - text: "系統架構"
            href: zh-TW/architecture.qmd
          - text: "效能與可靠性"
            href: zh-TW/performance.qmd

  page-footer:
    left: "IrisPipe — built by Jeff Hsu"
    right:
      - icon: github
        href: https://github.com/tibame201020/IrisPipe

format:
  html:
    theme:
      - cosmo
      - custom.scss
    highlight-style: github-dark
    code-fold: false
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    grid:
      sidebar-width: 0px
      body-width: 900px
      margin-width: 200px
