name: Atomic Chunk Matrix
on:
  workflow_dispatch:
  push:
    branches: [perf/atomic-chunk-matrix]
    paths:
      - 'backend/k6/atomic-chunk-matrix.js'
      - '.github/workflows/atomic-chunk-matrix.yml'
permissions:
  contents: read
concurrency:
  group: atomic-chunk-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa
      IRISPIPE_SYNC_REQUEST_TIMEOUT: 20m
      MATRIX_REPORT: ${{ github.workspace }}/matrix-results/atomic-chunk-results.json
      MATRIX_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: grafana/setup-k6-action@v1
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start isolated CI backend and record environment
        working-directory: backend
        run: |
          mkdir -p ../matrix-results
          lscpu > ../matrix-results/environment.txt
          free -h >> ../matrix-results/environment.txt
          java -version 2>> ../matrix-results/environment.txt
          k6 version >> ../matrix-results/environment.txt
          git rev-parse HEAD >> ../matrix-results/environment.txt
          app_jar=$(find target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n 1)
          java -Xms1g -Xmx4g -jar "$app_jar" > ../matrix-results/backend.log 2>&1 &
          echo $! > ../matrix-results/backend.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/v1/sync-config > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Smoke test the complete reporting and recovery path
        working-directory: backend/k6
        run: |
          MATRIX_SIZES=10000 MATRIX_REPEATS=1 MATRIX_REPORT="${{ github.workspace }}/matrix-results/smoke-results.json" k6 run atomic-chunk-matrix.js
          jq -e '.completed == true and (.results | length == 4) and all(.assertions[]; .passed == true)' "${{ github.workspace }}/matrix-results/smoke-results.json"
      - name: Measure and verify JOB and CHUNK
        working-directory: backend/k6
        run: k6 run atomic-chunk-matrix.js
      - name: Require a complete report
        run: jq -e '.completed == true and (.results | length == 14) and all(.assertions[]; .passed == true)' "$MATRIX_REPORT"
      - name: Stop backend
        if: always()
        run: |
          if [ -f matrix-results/backend.pid ]; then kill "$(cat matrix-results/backend.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-chunk-matrix
          path: matrix-results/
          retention-days: 14
