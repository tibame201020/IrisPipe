name: k6 Deep Volume Benchmark

on:
  workflow_dispatch:
  schedule:
    # Weekly deep-capacity run. Keeps long-running cases out of normal PR CI.
    - cron: "0 18 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: k6-deep-volume
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build Backend Jar + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend and run unit tests
        working-directory: backend
        run: mvn -B package
      - name: Locate runnable jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          app_jar="$(find backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"
          test -n "$app_jar"
          echo "app_jar=$app_jar" >> "$GITHUB_OUTPUT"
      - name: Upload runnable jar
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-benchmark-runnable-jar
          path: ${{ steps.jar.outputs.app_jar }}
          if-no-files-found: error

  h2-deep-volume:
    name: H2→H2 (${{ matrix.atomic }}, ${{ matrix.rows }} rows)
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        atomic: [JOB, CHUNK]
        rows: [100000, 1000000, 10000000, 20000000, 50000000]
    env:
      APP_LOG: ${{ github.workspace }}/.k6-tmp/deep-h2-${{ matrix.atomic }}-${{ matrix.rows }}.log
      APP_PID_FILE: ${{ github.workspace }}/.k6-tmp/deep-h2-${{ matrix.atomic }}-${{ matrix.rows }}.pid
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install k6
        id: setup_k6
        continue-on-error: true
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.7.1'

      - name: Fallback install k6
        if: steps.setup_k6.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.1
          archive="k6-v${version}-linux-amd64.tar.gz"
          url="https://github.com/grafana/k6/releases/download/v${version}/${archive}"
          rm -f "$archive"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --output "$archive" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to download k6 after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          tar -xzf "$archive"
          sudo install -m 0755 "k6-v${version}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: Download runnable jar
        id: download_runnable_jar
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: deep-benchmark-runnable-jar
          path: backend/target

      - name: Fallback build runnable jar
        if: steps.download_runnable_jar.outcome == 'failure'
        working-directory: backend
        run: mvn -B package
      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/.k6-tmp"
          app_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"
          nohup java -Xms512m -Xmx4g -jar "$app_jar" > "$APP_LOG" 2>&1 &
          echo $! > "$APP_PID_FILE"
      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/api/v1/sync-config >/dev/null && exit 0
            sleep 2
          done
          tail -n 200 "$APP_LOG" || true
          exit 1
      - name: Run H2 deep-volume benchmark
        working-directory: backend/k6
        env:
          ATOMIC_LEVEL: ${{ matrix.atomic }}
          ROW_COUNT: ${{ matrix.rows }}
          BATCH_SIZE: "5000"
          BENCHMARK_MODE: success
          DB_PAIR: h2-h2
          K6_SETUP_TIMEOUT: "30m"
          K6_MAX_DURATION: "300m"
          BENCHMARK_REPORT: ${{ github.workspace }}/.k6-tmp/deep-h2-${{ matrix.atomic }}-${{ matrix.rows }}.json
        run: k6 run data-volume-benchmark.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-h2-${{ matrix.atomic }}-${{ matrix.rows }}
          path: ${{ github.workspace }}/.k6-tmp/deep-h2-${{ matrix.atomic }}-${{ matrix.rows }}.json
          if-no-files-found: ignore
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deep-h2-log-${{ matrix.atomic }}-${{ matrix.rows }}
          path: ${{ env.APP_LOG }}
          if-no-files-found: ignore
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f "$APP_PID_FILE" ]; then kill "$(cat "$APP_PID_FILE")" || true; fi

  postgres-h2-deep:
    name: PostgreSQL→H2 (${{ matrix.atomic }}, ${{ matrix.rows }} rows)
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        atomic: [JOB, CHUNK]
        rows: [1000000, 10000000]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: irispipe_bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irispipe_bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_LOG: ${{ github.workspace }}/.k6-tmp/deep-cross-${{ matrix.atomic }}-${{ matrix.rows }}.log
      APP_PID_FILE: ${{ github.workspace }}/.k6-tmp/deep-cross-${{ matrix.atomic }}-${{ matrix.rows }}.pid
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install k6
        id: setup_k6
        continue-on-error: true
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.7.1'

      - name: Fallback install k6
        if: steps.setup_k6.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.1
          archive="k6-v${version}-linux-amd64.tar.gz"
          url="https://github.com/grafana/k6/releases/download/v${version}/${archive}"
          rm -f "$archive"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --output "$archive" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to download k6 after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          tar -xzf "$archive"
          sudo install -m 0755 "k6-v${version}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: Download runnable jar
        id: download_runnable_jar
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: deep-benchmark-runnable-jar
          path: backend/target

      - name: Fallback build runnable jar
        if: steps.download_runnable_jar.outcome == 'failure'
        working-directory: backend
        run: mvn -B package
      - name: Seed PostgreSQL source in-database
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          docker exec -i "$postgres_container" psql -U postgres -d irispipe_bench <<SQL
          DROP TABLE IF EXISTS benchmark_source;
          CREATE TABLE benchmark_source (id INT PRIMARY KEY, name VARCHAR(255));
          INSERT INTO benchmark_source (id, name)
          SELECT g, 'row-' || g FROM generate_series(1, ${{ matrix.rows }}) AS g;
          ANALYZE benchmark_source;
          SQL
      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/.k6-tmp"
          app_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"
          nohup java -Xms512m -Xmx4g -jar "$app_jar" > "$APP_LOG" 2>&1 &
          echo $! > "$APP_PID_FILE"
      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/api/v1/sync-config >/dev/null && exit 0
            sleep 2
          done
          tail -n 200 "$APP_LOG" || true
          exit 1
      - name: Run cross-database deep benchmark
        working-directory: backend/k6
        env:
          ATOMIC_LEVEL: ${{ matrix.atomic }}
          ROW_COUNT: ${{ matrix.rows }}
          BATCH_SIZE: "5000"
          BENCHMARK_MODE: success
          DB_PAIR: postgres-h2
          K6_SETUP_TIMEOUT: "30m"
          K6_MAX_DURATION: "300m"
          POSTGRES_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/irispipe_bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          BENCHMARK_REPORT: ${{ github.workspace }}/.k6-tmp/deep-cross-${{ matrix.atomic }}-${{ matrix.rows }}.json
        run: k6 run data-volume-benchmark.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-cross-${{ matrix.atomic }}-${{ matrix.rows }}
          path: ${{ github.workspace }}/.k6-tmp/deep-cross-${{ matrix.atomic }}-${{ matrix.rows }}.json
          if-no-files-found: ignore
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f "$APP_PID_FILE" ]; then kill "$(cat "$APP_PID_FILE")" || true; fi

  rdbms-deep-volume:
    name: ${{ matrix.engine }}→${{ matrix.engine }} (${{ matrix.atomic }}, ${{ matrix.rows }} rows)
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { engine: postgres, atomic: JOB, rows: 1000000 }
          - { engine: postgres, atomic: CHUNK, rows: 1000000 }
          - { engine: postgres, atomic: JOB, rows: 10000000 }
          - { engine: postgres, atomic: CHUNK, rows: 10000000 }
          - { engine: postgres, atomic: JOB, rows: 20000000 }
          - { engine: postgres, atomic: CHUNK, rows: 20000000 }
          - { engine: postgres, atomic: JOB, rows: 50000000 }
          - { engine: postgres, atomic: CHUNK, rows: 50000000 }
          - { engine: mysql, atomic: JOB, rows: 1000000 }
          - { engine: mysql, atomic: CHUNK, rows: 1000000 }
          - { engine: mysql, atomic: JOB, rows: 10000000 }
          - { engine: mysql, atomic: CHUNK, rows: 10000000 }
          - { engine: mysql, atomic: JOB, rows: 20000000 }
          - { engine: mysql, atomic: CHUNK, rows: 20000000 }
          - { engine: mysql, atomic: JOB, rows: 50000000 }
          - { engine: mysql, atomic: CHUNK, rows: 50000000 }
          - { engine: mariadb, atomic: JOB, rows: 1000000 }
          - { engine: mariadb, atomic: CHUNK, rows: 1000000 }
          - { engine: mariadb, atomic: JOB, rows: 10000000 }
          - { engine: mariadb, atomic: CHUNK, rows: 10000000 }
          - { engine: sqlserver, atomic: JOB, rows: 1000000 }
          - { engine: sqlserver, atomic: CHUNK, rows: 1000000 }
          - { engine: sqlserver, atomic: JOB, rows: 10000000 }
          - { engine: sqlserver, atomic: CHUNK, rows: 10000000 }
          - { engine: oracle, atomic: JOB, rows: 1000000 }
          - { engine: oracle, atomic: CHUNK, rows: 1000000 }
          - { engine: oracle, atomic: JOB, rows: 10000000 }
          - { engine: oracle, atomic: CHUNK, rows: 10000000 }
    env:
      APP_LOG: ${{ github.workspace }}/.k6-tmp/deep-${{ matrix.engine }}-${{ matrix.atomic }}-${{ matrix.rows }}.log
      APP_PID_FILE: ${{ github.workspace }}/.k6-tmp/deep-${{ matrix.engine }}-${{ matrix.atomic }}-${{ matrix.rows }}.pid
      REPORT_FILE: ${{ github.workspace }}/.k6-tmp/deep-${{ matrix.engine }}-${{ matrix.atomic }}-${{ matrix.rows }}.json
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install k6
        id: setup_k6
        continue-on-error: true
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.7.1'

      - name: Fallback install k6
        if: steps.setup_k6.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.1
          archive="k6-v${version}-linux-amd64.tar.gz"
          url="https://github.com/grafana/k6/releases/download/v${version}/${archive}"
          rm -f "$archive"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --output "$archive" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to download k6 after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          tar -xzf "$archive"
          sudo install -m 0755 "k6-v${version}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: Download runnable jar
        id: download_runnable_jar
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: deep-benchmark-runnable-jar
          path: backend/target

      - name: Fallback build runnable jar
        if: steps.download_runnable_jar.outcome == 'failure'
        working-directory: backend
        run: mvn -B package
      - name: Start and seed ${{ matrix.engine }} in-database
        shell: bash
        run: bash backend/k6/rdbms-deep-harness.sh start "${{ matrix.engine }}" "${{ matrix.rows }}"
      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/.k6-tmp"
          app_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"
          nohup java -Xms512m -Xmx2g -jar "$app_jar" > "$APP_LOG" 2>&1 &
          echo $! > "$APP_PID_FILE"
      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/api/v1/sync-config >/dev/null && exit 0
            sleep 2
          done
          tail -n 200 "$APP_LOG" || true
          exit 1
      - name: Run ${{ matrix.engine }} deep-volume benchmark
        working-directory: backend/k6
        env:
          ATOMIC_LEVEL: ${{ matrix.atomic }}
          ROW_COUNT: ${{ matrix.rows }}
          BATCH_SIZE: "5000"
          BENCHMARK_MODE: success
          DB_PAIR: ${{ matrix.engine }}-${{ matrix.engine }}
          K6_SETUP_TIMEOUT: "10m"
          K6_MAX_DURATION: "300m"
          PIPELINE_HTTP_TIMEOUT: "300m"
          BENCHMARK_REPORT: ${{ env.REPORT_FILE }}
        run: k6 run data-volume-benchmark.js
      - name: Verify external destination row count
        shell: bash
        run: |
          set -euo pipefail
          actual="$(bash backend/k6/rdbms-deep-harness.sh count "${{ matrix.engine }}")"
          python backend/k6/finalize-external-benchmark.py --report "$REPORT_FILE" --actual-rows "$actual"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.engine }}-${{ matrix.atomic }}-${{ matrix.rows }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: ignore
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.engine }}-log-${{ matrix.atomic }}-${{ matrix.rows }}
          path: ${{ env.APP_LOG }}
          if-no-files-found: ignore
      - name: Stop backend and database
        if: always()
        shell: bash
        run: |
          if [ -f "$APP_PID_FILE" ]; then kill "$(cat "$APP_PID_FILE")" || true; fi
          bash backend/k6/rdbms-deep-harness.sh stop "${{ matrix.engine }}"

  publish-deep-results:
    name: Publish Deep Benchmark Results
    needs: [h2-deep-volume, postgres-h2-deep, rdbms-deep-volume]
    if: github.ref == 'refs/heads/main' && needs.h2-deep-volume.result == 'success' && needs.postgres-h2-deep.result == 'success' && needs.rdbms-deep-volume.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download deep benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deep-*
          path: .deep-results
          merge-multiple: true
      - name: Aggregate reports and render Quarto fragment
        shell: bash
        run: |
          python backend/k6/update-deep-performance-results.py \
            --reports-dir .deep-results \
            --results quarto/deep-performance-results.json \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit-sha "$GITHUB_SHA"
      - name: Commit deep benchmark results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quarto/deep-performance-results.json quarto/_generated/deep-performance-results-en.md quarto/_generated/deep-performance-results-zh.md
          if ! git diff --cached --quiet; then
            git commit -m "perf: update deep benchmark results $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Quarto project
        working-directory: quarto
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quarto/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
