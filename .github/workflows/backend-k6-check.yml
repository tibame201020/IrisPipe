name: Backend K6 Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-k6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend Jar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend without unit tests
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Locate runnable jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          app_jar="$(find backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"

          if [ -z "$app_jar" ]; then
            echo "No runnable jar found in backend/target" >&2
            exit 1
          fi

          echo "app_jar=$app_jar" >> "$GITHUB_OUTPUT"

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-runnable-jar
          path: ${{ steps.jar.outputs.app_jar }}
          if-no-files-found: error

  k6-regression:
    name: K6 Regression (${{ matrix.suite.name }})
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: config
            name: Config
          - id: workspace
            name: Workspace
          - id: pipeline-core
            name: Pipeline Core
          - id: pipeline-resume
            name: Pipeline Resume
          - id: pipeline-stop
            name: Pipeline Stop
          - id: pipeline-operator-safety
            name: Pipeline Operator Safety
          - id: pipeline-observability
            name: Pipeline Observability
          - id: pipeline-rerun
            name: Pipeline Rerun
          - id: pipeline-control-loop
            name: Pipeline Control Loop
          - id: runtime
            name: Runtime
    env:
      K6_TMP_DIR: ${{ github.workspace }}/.k6-tmp
      APP_LOG: ${{ github.workspace }}/.k6-tmp/irispipe-k6-${{ matrix.suite.id }}.log
      APP_PID_FILE: ${{ github.workspace }}/.k6-tmp/irispipe-k6-${{ matrix.suite.id }}.pid
      IRISPIPE_K6_NAMESPACE: ${{ matrix.suite.id }}
      IRISPIPE_PIPELINE_NAME_PREFIX: gha-${{ matrix.suite.id }}-${{ github.run_id }}
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install K6
        uses: grafana/setup-k6-action@v1

      - name: Download runnable jar
        uses: actions/download-artifact@v4
        with:
          name: backend-runnable-jar
          path: backend/target

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K6_TMP_DIR"
          app_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"

          if [ -z "$app_jar" ]; then
            echo "No runnable jar found in backend/target" >&2
            exit 1
          fi

          nohup java -jar "$app_jar" > "$APP_LOG" 2>&1 &
          echo $! > "$APP_PID_FILE"

      - name: Wait for backend readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/sync-config > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become ready in time." >&2
          tail -n 200 "$APP_LOG" || true
          exit 1

      - name: Run K6 suite (${{ matrix.suite.name }})
        working-directory: backend/k6
        shell: pwsh
        run: ./run-tests.ps1 -Suite ${{ matrix.suite.id }}

      - name: Print backend log on failure
        if: failure()
        shell: bash
        run: tail -n 200 "$APP_LOG" || true

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-k6-log-${{ matrix.suite.id }}
          path: ${{ env.APP_LOG }}
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f "$APP_PID_FILE" ]; then
            kill "$(cat "$APP_PID_FILE")" || true
          fi
