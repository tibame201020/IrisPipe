name: Backend K6 Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-k6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k6-regression:
    name: K6 Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K6_TMP_DIR: ${{ github.workspace }}/.k6-tmp
      APP_LOG: ${{ github.workspace }}/.k6-tmp/irispipe-k6.log
      APP_PID_FILE: ${{ github.workspace }}/.k6-tmp/irispipe-k6.pid
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install K6
        uses: grafana/setup-k6-action@v1

      - name: Build backend without unit tests
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K6_TMP_DIR"
          app_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"

          if [ -z "$app_jar" ]; then
            echo "No runnable jar found in backend/target" >&2
            exit 1
          fi

          nohup java -jar "$app_jar" > "$APP_LOG" 2>&1 &
          echo $! > "$APP_PID_FILE"

      - name: Wait for backend readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/sync-config > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become ready in time." >&2
          tail -n 200 "$APP_LOG" || true
          exit 1

      - name: Run K6 regression suite
        working-directory: backend/k6
        shell: pwsh
        run: ./run-tests.ps1

      - name: Print backend log on failure
        if: failure()
        shell: bash
        run: tail -n 200 "$APP_LOG" || true

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f "$APP_PID_FILE" ]; then
            kill "$(cat "$APP_PID_FILE")" || true
          fi
